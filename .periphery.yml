# Periphery config for MovingPaper (SwiftPM package, single executable target).
# Usage:
#   Install the final 3.8.0 binary from
#   https://github.com/peripheryapp/periphery/releases/tag/3.8.0
#   (upstream is archived; the Homebrew cask is stale at 2.21.2).
#   periphery scan
#
# Notes:
# - There is no Xcode project in this repo. Leave project/schemes unset so
#   Periphery uses SwiftPM (`swift build`) instead of xcodebuild.
# - build_arguments: Swift 6.4's default build system writes no index store
#   where Periphery 3.8.0 looks for it, so the scan fails with "index store
#   path does not exist". The native build system restores the old layout.
# - retain_public: anything public is an API surface, even if not referenced
#   inside this package — keep it.
# - retain_objc_accessible: @objc declarations are commonly called via
#   selector(...) which Periphery can't always follow, so don't flag them.
# - retain_unused_protocol_func_params: AppKit/Sparkle protocol methods
#   intentionally ignore some parameters; keep them named.
# - retain_assign_only_properties: several AppKit objects are intentionally
#   retained by stored properties even when they are not read again.
build_arguments:
  - --build-system
  - native
retain_public: true
retain_objc_accessible: true
retain_unused_protocol_func_params: true
retain_assign_only_properties: true
report_exclude:
  - sources/Resources/**
