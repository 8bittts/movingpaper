name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Swift version
        run: swift --version

      # The app requires macOS 27 and no hosted runner runs it yet, so this job
      # compiles the app and its tests but cannot launch them. The test gate is
      # ./scripts/smoke-test.sh on a macOS 27 Mac. Restore `swift test` here when
      # a macOS 27 image exists.
      - name: Compile app and tests
        run: swift build --build-tests
